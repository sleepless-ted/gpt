[workspace]
name = "gpt"
version = "0.1.0"
description = "Petit GPT pédagogique et visualisation Gradio"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"
ipykernel = "*"
numpy = "*"
pandas = "2.3.3.*"
matplotlib = "*"
seaborn = "*"
scipy = "*"
scikit-learn = "*"
tqdm = "*"
pytorch = "*"

[pypi-dependencies]
datasets = "*"
nltk = "*"
gradio = ">=5.0"
plotly = ">=5.20"
huggingface-hub = ">=0.25"

[tasks]
app = "python app.py"
check = "python -c \"import ast; ast.parse(open('app.py', encoding='utf-8').read()); print('app.py: AST OK')\""
